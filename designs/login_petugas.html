<body class="bg-surface text-text-primary min-h-screen flex flex-col items-center justify-center relative overflow-hidden">
<!-- Atmospheric Background Element -->
<div class="absolute inset-0 z-0 opacity-20 pointer-events-none">

</div>
<!-- Main Content Canvas -->
<main class="z-10 w-full max-w-md px-margin-mobile md:px-0">
<!-- Login Card -->
<div class="bg-surface-container-lowest border border-border-muted rounded-xl p-8 md:p-10 shadow-sm transition-all duration-300 hover:shadow-md">
<!-- Logo Section -->
<div class="flex flex-col items-center mb-10">
<div class="w-16 h-16 mb-4 flex items-center justify-center rounded-lg bg-primary-container text-white">
<span class="material-symbols-outlined text-[40px]" style="font-variation-settings: 'FILL' 1;">archive</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-primary tracking-tight text-center">Lakespra Archive</h1>
<p class="font-body-md text-body-md text-text-secondary mt-2 text-center">Operational Personnel Access</p>
</div>
<!-- Form -->
<form action="#" class="space-y-6">
<!-- Email Field -->
<div class="space-y-2">
<label class="block font-label-md text-label-md text-text-primary" for="email">Alamat Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-text-secondary text-[20px]">mail</span>
<input class="w-full pl-10 pr-4 py-3 bg-white border border-border-muted rounded-lg font-body-md text-body-md focus:outline-none focus:ring-1 focus:ring-secondary-container focus:border-on-secondary-container transition-all" id="email" name="email" placeholder="nama@lakespra.go.id" type="email" value="petugas@lakespra.go.id"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<div class="flex justify-between items-center">
<label class="block font-label-md text-label-md text-text-primary" for="password">Kata Sandi</label>
<a class="font-label-md text-label-md text-on-secondary-container hover:underline" href="#">Lupa sandi?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-text-secondary text-[20px]">lock</span>
<input class="w-full pl-10 pr-12 py-3 bg-white border border-border-muted rounded-lg font-body-md text-body-md focus:outline-none focus:ring-1 focus:ring-secondary-container focus:border-on-secondary-container transition-all" id="password" name="password" placeholder="••••••••" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-text-secondary hover:text-text-primary focus:outline-none" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center">
<input class="w-4 h-4 text-on-secondary-container border-border-muted rounded focus:ring-secondary-container" id="remember" name="remember" type="checkbox"/>
<label class="ml-2 font-body-md text-body-md text-text-secondary cursor-pointer" for="remember">Remember Me</label>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary-container text-white font-label-md text-label-md py-4 rounded-lg hover:bg-black transition-colors active:scale-[0.98] transform flex items-center justify-center gap-2" type="submit">
                    MASUK KE SISTEM
                    <span class="material-symbols-outlined text-[18px]">login</span>
</button>
</form>
<!-- Divider -->
<div class="relative my-8">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-border-muted"></div>
</div>
<div class="relative flex justify-center text-label-md">
<span class="bg-surface-container-lowest px-4 text-text-secondary">ATAU</span>
</div>
</div>
<!-- Secondary Actions -->
<div class="space-y-4">
<a class="w-full flex items-center justify-center gap-2 font-body-md text-body-md text-text-secondary hover:text-primary transition-colors py-2 group" href="#">

<div class="fixed bottom-0 right-0 p-12 pointer-events-none opacity-[0.03] select-none">
<div class="grid grid-cols-4 gap-4">
<span class="material-symbols-outlined text-9xl">medical_services</span>
<span class="material-symbols-outlined text-9xl">folder_managed</span>
<span class="material-symbols-outlined text-9xl">clinical_notes</span>
<span class="material-symbols-outlined text-9xl">shield_person</span>
</div>

<script>
        // Micro-interaction for input focus
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.closest('.space-y-2').querySelector('label').classList.add('text-on-secondary-container');
            });
            input.addEventListener('blur', () => {
                input.parentElement.closest('.space-y-2').querySelector('label').classList.remove('text-on-secondary-container');
            });
        });

        // Simple form submission animation
        const loginForm = document.querySelector('form');
        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const btn = loginForm.querySelector('button[type="submit"]');
            const originalContent = btn.innerHTML;
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin">sync</span> Memproses...';
            btn.disabled = true;
            
            // Mock delay
            setTimeout(() => {
                btn.innerHTML = '<span class="material-symbols-outlined">check_circle</span> BERHASIL';
                btn.classList.replace('bg-primary-container', 'bg-success');
                setTimeout(() => {
                    alert('Redirecting to Archive Dashboard...');
                    // Reset for demo purposes
                    btn.innerHTML = originalContent;
                    btn.classList.replace('bg-success', 'bg-primary-container');
                    btn.disabled = false;
                }, 1000);
            }, 1500);
        });
    </script>
